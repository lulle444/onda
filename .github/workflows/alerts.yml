name: Check alerts
# Calls the site's alert check every 15 minutes (Vercel's free cron only runs once a day).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          curl -sf -o /dev/null --max-time 20 https://onda-plum.vercel.app/ || { echo "site not live yet"; exit 0; }
          curl -fsS --max-time 90 https://onda-plum.vercel.app/api/check-alerts
